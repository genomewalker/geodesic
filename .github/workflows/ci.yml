name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Checkout genopack (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: genomewalker/genopack
          path: genopack_src

      - name: Build genopack
        run: |
          cmake -B genopack_src/build -S genopack_src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_BASE_DIR=genopack_src/.fc \
            -DXxhash_INCLUDE_DIR=/usr/include
          cmake --build genopack_src/build --parallel --target genopack_lib

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ ccache \
            libzstd-dev libxxhash-dev libdeflate-dev \
            git

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .fc
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR=.fc \
            -DGENOPACK_INCLUDE_DIR="${{ github.workspace }}/genopack_src/include" \
            -DGENOPACK_LIBRARY="${{ github.workspace }}/genopack_src/build/libgenopack_lib.a"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
